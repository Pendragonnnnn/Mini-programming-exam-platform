# Aegis — web exam platform.
#   docker compose up -d --build                      → app on http://localhost:8080 (local runner, demo only)
#   docker compose --profile judge0 up -d --build     → also start Judge0 (set RUNNER=judge0 in .env)
#   docker compose --profile ai up -d                 → also start Ollama (set AI_PROVIDER=ollama)
#   Then open the app: the first visit shows a one-time setup screen to create the first teacher.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./web
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

  # ---------------- Judge0 sandbox (profile: judge0)
  judge0-server:
    profiles: [judge0]
    image: judge0/judge0:1.13.1
    volumes: [./deploy/judge0.conf:/judge0.conf:ro]
    privileged: true
    depends_on: [judge0-db, judge0-redis]
    restart: unless-stopped
  judge0-workers:
    profiles: [judge0]
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes: [./deploy/judge0.conf:/judge0.conf:ro]
    privileged: true
    depends_on: [judge0-db, judge0-redis]
    restart: unless-stopped
  judge0-db:
    profiles: [judge0]
    image: postgres:16-alpine
    environment: { POSTGRES_DB: judge0, POSTGRES_USER: judge0, POSTGRES_PASSWORD: judge0pass }
    volumes: [judge0db:/var/lib/postgresql/data]
    restart: unless-stopped
  judge0-redis:
    profiles: [judge0]
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "judge0redis"]
    restart: unless-stopped

  # ---------------- Local AI model (profile: ai)
  ollama:
    profiles: [ai]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  dbdata:
  judge0db:
  ollama:
