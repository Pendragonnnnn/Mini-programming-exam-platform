# Minimal Judge0 config for docker-compose (see https://github.com/judge0/judge0 for all options).
REDIS_HOST=judge0-redis
REDIS_PASSWORD=judge0redis
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0pass
AUTHN_TOKEN=
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false
CPU_TIME_LIMIT=5
MAX_CPU_TIME_LIMIT=15
WALL_TIME_LIMIT=10
MEMORY_LIMIT=512000
MAX_MEMORY_LIMIT=1024000
MAX_PROCESSES_AND_OR_THREADS=128
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
